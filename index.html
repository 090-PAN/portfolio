<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>潘佳丽 · 数据产品经理 | 3D 个人小岛</title>
<meta name="description" content="潘佳丽的数据产品经理作品集：4 段实习、2 项国家发明专利、数据要素素质大赛国家一等奖。3D 小岛 + 工作室，点击物件查看关于、经历、作品、爱好、足迹、联系方式与 AI 分身。" />
<meta property="og:title" content="潘佳丽 · 数据产品经理 · 3D 作品集" />
<meta property="og:description" content="让每一份数据，都被用出价值。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>" />
<style>
:root{
  --ink:#17202e;
  --ink-2:#4a5768;
  --ink-3:#8994a5;
  --accent:#2f6bff;
  --accent-soft:#e8f0ff;
  --cream:#fdf6ea;
  --line:rgba(20,40,80,.09);
  --shadow:0 12px 40px rgba(23,45,90,.12);
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);background:#cfe9ff;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
canvas#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas#scene.dragging{cursor:grabbing}
canvas#scene.pointing{cursor:pointer}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:8;pointer-events:none;user-select:none}
.hud-top{top:26px;left:30px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{margin:0;font-size:26px;letter-spacing:2px;font-weight:700;color:#132033;text-shadow:0 2px 18px rgba(255,255,255,.6)}
.brand .en{font-size:10px;letter-spacing:3px;color:#3a5470;opacity:.7;text-transform:uppercase}
.brand-sub{font-size:12.5px;color:#35506d;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:#2ea36d;box-shadow:0 0 0 4px rgba(46,163,109,.18)}
.hud-right{top:26px;right:30px;display:flex;gap:10px;align-items:center;pointer-events:auto}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.85);border-radius:999px;
  padding:7px 13px;font-size:11.5px;color:#3b526b;letter-spacing:.4px;
  box-shadow:0 6px 20px rgba(30,60,120,.08);
}
.hud-right .pill{cursor:pointer;transition:transform .2s ease, background .2s}
.hud-right .pill:hover{transform:translateY(-1px);background:rgba(255,255,255,.82)}

/* ---------- dock ---------- */
.dock{
  left:50%;bottom:24px;transform:translateX(-50%);
  display:flex;gap:6px;padding:7px;border-radius:999px;
  background:rgba(255,255,255,.68);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 16px 40px rgba(25,50,95,.14);
  pointer-events:auto;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none;
  z-index:10;
}
.dock::-webkit-scrollbar{display:none}
.dock button{
  border:0;background:transparent;color:#33465c;font-size:12px;font-family:inherit;
  padding:8px 13px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;
  white-space:nowrap;transition:background .18s, color .18s, transform .18s;
}
.dock button .ico{font-size:14px;line-height:1}
.dock button:hover{background:rgba(47,107,255,.1);color:#1e4ed8}
.dock button.active{background:#1b2a40;color:#fff}
.hint{left:50%;bottom:78px;transform:translateX(-50%);font-size:11px;color:#496581;letter-spacing:.6px;opacity:.85;white-space:nowrap}
@media (max-width:640px){.hint{display:none}}

/* ---------- labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden;transition:opacity .3s}
body.panel-open #labels{opacity:0}
body.riding #labels{opacity:0}
.tag{
  position:absolute;transform:translate(-50%,-100%);
  background:rgba(19,30,46,.82);color:#fff;font-size:11.5px;letter-spacing:.5px;
  padding:5px 10px;border-radius:999px;white-space:nowrap;
  box-shadow:0 6px 18px rgba(10,20,40,.2);opacity:.5;transition:opacity .2s, transform .2s, background .2s;
  backdrop-filter:blur(6px);
}
.tag.on{opacity:1;background:#2f6bff;transform:translate(-50%,-115%) scale(1.04)}

/* ---------- panel ---------- */
.panel{
  position:fixed;top:0;right:0;height:100%;width:min(432px,100vw);z-index:20;
  display:flex;flex-direction:column;
  background:rgba(255,252,247,.93);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-left:1px solid rgba(255,255,255,.9);
  box-shadow:-30px 0 80px rgba(20,45,90,.18);
  transform:translateX(104%);transition:transform .55s cubic-bezier(.22,.9,.25,1);
}
.panel.open{transform:none}
.panel-head{padding:26px 26px 16px;border-bottom:1px solid var(--line);position:relative;flex:0 0 auto}
.panel-head .eyebrow{font-size:10px;letter-spacing:3px;color:var(--ink-3);text-transform:uppercase;margin-bottom:8px}
.panel-head h2{margin:0;font-size:22px;letter-spacing:1px}
.panel-head p{margin:8px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.close{
  position:absolute;top:20px;right:20px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.7);cursor:pointer;font-size:16px;color:#43536a;line-height:1;
  transition:transform .2s, background .2s;
}
.close:hover{background:#fff;transform:rotate(90deg)}
.panel-body{padding:20px 22px 30px;overflow-y:auto;overscroll-behavior:contain;flex:1 1 auto;scrollbar-width:thin}
.panel-body::-webkit-scrollbar{width:6px}
.panel-body::-webkit-scrollbar-thumb{background:rgba(60,90,140,.2);border-radius:3px}
.foot-note{padding:10px 22px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-3);letter-spacing:.3px;flex:0 0 auto}

/* ---------- shared bits ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(30,60,120,.05)}
.card h3{margin:0 0 4px;font-size:14.5px;letter-spacing:.3px}
.card .meta{font-size:11px;color:var(--ink-3);letter-spacing:.5px}
.card p{margin:9px 0 0;font-size:12.8px;line-height:1.72;color:#39485c}
.card ul{margin:8px 0 0;padding-left:17px}
.card li{font-size:12.6px;line-height:1.72;color:#39485c;margin-bottom:3px}
.quote{border-left:3px solid #2f6bff;padding:8px 0 8px 12px;margin-top:12px;font-size:12.4px;color:#24406b;font-style:italic;line-height:1.7;background:linear-gradient(90deg,rgba(47,107,255,.06),transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-size:11px;padding:4px 9px;border-radius:999px;background:#f1f4fa;color:#42536a;letter-spacing:.3px}
.chip.blue{background:var(--accent-soft);color:#1e4ed8}
.sec-title{font-size:11px;letter-spacing:2.4px;color:var(--ink-3);margin:22px 0 10px;text-transform:uppercase}
.sec-title:first-child{margin-top:4px}
.tabs{display:flex;gap:6px;padding:4px;background:#f0f3f8;border-radius:999px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;font-size:12px;border-radius:999px;cursor:pointer;color:#556;font-family:inherit;transition:.2s}
.tabs button.on{background:#fff;color:#16233a;box-shadow:0 3px 10px rgba(30,60,120,.11)}
.tabpane{display:none}.tabpane.on{display:block}

/* ---- about ---- */
.about-hero{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.portrait{width:112px;height:150px;object-fit:cover;object-position:50% 22%;border-radius:14px;box-shadow:0 10px 26px rgba(30,60,120,.16);flex:0 0 auto}
.about-hero .who{font-size:12.8px;line-height:1.75;color:#3b4a5e}
.about-hero .who b{font-size:15px;letter-spacing:.5px;color:#17202e;display:block;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;border-radius:999px;padding:3px 8px;background:#eff3fb;color:#3b5470;margin:0 4px 4px 0}
.badge.red{background:#fdeceb;color:#c04a3d}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.stat b{display:block;font-size:19px;letter-spacing:.5px;color:#1b2a40}
.stat span{font-size:10.5px;color:var(--ink-3);letter-spacing:.4px}

/* ---- works ---- */
.work{position:relative;overflow:hidden}
.work .no{position:absolute;right:14px;top:12px;font-size:11px;color:#c8d2e2;letter-spacing:1px}
.tagline{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.mini-bars{display:flex;align-items:flex-end;gap:4px;height:34px;margin-top:12px}
.mini-bars i{flex:1;background:linear-gradient(180deg,#8fb6ff,#2f6bff);border-radius:3px 3px 1px 1px;opacity:.9}

/* ---- hobbies ---- */
.piano-ui{display:flex;gap:3px;margin-top:12px;padding:10px;background:#171b24;border-radius:12px;user-select:none}
.piano-ui button{flex:1;height:64px;border:0;border-radius:0 0 5px 5px;background:#fbfbfd;color:#5b6472;font-size:10px;cursor:pointer;transition:transform .08s,background .12s;font-family:inherit}
.piano-ui button:active,.piano-ui button.hit{transform:translateY(4px);background:#dbe6ff;color:#1e4ed8}
.hobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hobby{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.hobby b{font-size:13px;display:block;margin-bottom:3px}
.hobby span{font-size:11px;color:var(--ink-3);line-height:1.55}

/* ---- footprints ---- */
.foot{display:flex;gap:12px;align-items:center}
.foot .pin{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ffe0b8,#ffb27a);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.foot .txt b{font-size:13.5px}
.foot .txt div{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.6}
.dashed{border:1px dashed #cfd8e6;background:#fafbfd;border-radius:14px;padding:14px;text-align:center;font-size:11.5px;color:#8291a6;line-height:1.7;margin-bottom:12px}

/* ---- contact ---- */
.contact-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px}
.contact-row .ico2{width:34px;height:34px;border-radius:10px;background:#f2f6ff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.contact-row .k{font-size:13px;letter-spacing:.3px}
.contact-row .v{font-size:11px;color:var(--ink-3);margin-top:2px;word-break:break-all}
.copy{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:11px;cursor:pointer;color:#3a4c63;font-family:inherit;transition:.18s}
.copy:hover{background:#f4f7ff;color:#1e4ed8}

/* ---- chat ---- */
.panel.chat .panel-body{display:flex;flex-direction:column;padding:14px 16px 16px;overflow:hidden}
.msgs{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px;scrollbar-width:thin}
.msg{display:flex;gap:9px;align-items:flex-end;max-width:100%}

.chat-tools{flex:0 0 auto}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.suggest button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:11.5px;color:#3d5271;cursor:pointer;font-family:inherit;transition:.18s}
.suggest button:hover{background:#eff4ff;border-color:#c9dbff;color:#1e4ed8}
.inputbar{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px}
.inputbar input{flex:1;border:0;outline:0;font-size:13px;font-family:inherit;color:#22304a;background:transparent}
.inputbar button{width:36px;height:36px;border-radius:11px;border:0;background:#2f6bff;color:#fff;cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.18s}
.inputbar button:hover{background:#1e56e0}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(160deg,#d9ecff,#fff3e4 70%,#ffe7d6);transition:opacity .8s ease, visibility .8s}
#loader.hide{opacity:0;visibility:hidden}
.load-inner{text-align:center}
.load-inner .big{font-size:30px;letter-spacing:6px;color:#1b2a40;font-weight:700}
.load-inner .sub{margin-top:10px;font-size:12px;letter-spacing:2px;color:#5a708c}
.load-bar{width:180px;height:3px;border-radius:3px;background:rgba(30,60,110,.12);margin:22px auto 0;overflow:hidden}
.load-bar i{display:block;height:100%;width:35%;background:#2f6bff;border-radius:3px;animation:load 1.4s cubic-bezier(.5,0,.3,1) infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

/* ---------- ride hud ---------- */
#ride{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:12;
  background:rgba(18,28,44,.86);color:#fff;border-radius:999px;padding:10px 18px;font-size:12.5px;
  display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:.35s;backdrop-filter:blur(8px)}
#ride.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#ride button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}

/* ---------- responsive ---------- */
@media (max-width:760px){
  .hud-top{top:16px;left:16px}
  .brand h1{font-size:20px}
  .brand-sub .edu{display:none}
  .hud-right{top:16px;right:14px}
  .hud-right .pill{font-size:10.5px;padding:6px 10px}
  .panel{top:auto;bottom:0;height:min(82vh,760px);width:100%;border-left:0;border-top:1px solid rgba(255,255,255,.9);border-radius:22px 22px 0 0;transform:translateY(105%)}
  .panel.open{transform:none}
  .panel-head{padding:20px 20px 12px}
  .panel-head h2{font-size:19px}
  .dock{bottom:14px;left:12px;right:12px;transform:none;max-width:none;justify-content:center;flex-wrap:wrap;padding:6px;border-radius:20px}
  .dock button{flex:1 0 21%;justify-content:center}
  .dock button{padding:7px 10px;font-size:11.5px}
  #ride{bottom:84px}
  .portrait{width:88px;height:118px}
}
@media (max-height:560px){
  .panel{height:100%}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<div class="hud hud-top">
  <div class="brand"><h1>潘佳丽</h1><span class="en">PAN JIALI · PORTFOLIO</span></div>
  <div class="brand-sub"><span class="dot"></span><span>数据产品经理</span><span class="edu">· 广东外语外贸大学 管理科学与工程（在读）</span></div>
</div>

<div class="hud hud-right">
  <div class="pill" id="btnReset">🧭 回到全景</div>
</div>

<div class="hud hint">拖拽旋转 · 滚轮缩放 · 点击小岛上的物件进入模块</div>

<div class="hud dock" id="dock">
  <button data-go="about"><span class="ico">🏠</span>关于</button>
  <button data-go="experience"><span class="ico">📚</span>经历</button>
  <button data-go="works"><span class="ico">🖥</span>作品</button>
  <button data-go="hobbies"><span class="ico">🎹</span>爱好</button>
  <button data-go="footprints"><span class="ico">📸</span>足迹</button>
  <button data-go="contact"><span class="ico">✉️</span>联系</button>
  <button data-go="ai"><span class="ico">🤖</span>AI 分身</button>
  <button data-go="duck"><span class="ico">🦆</span>彩蛋</button>
</div>

<aside class="panel" id="panel">
  <div class="panel-head">
    <div class="eyebrow" id="pEyebrow"></div>
    <h2 id="pTitle"></h2>
    <p id="pSub"></p>
    <button class="close" id="pClose">✕</button>
  </div>
  <div class="panel-body" id="pBody"></div>
  <div class="foot-note" id="pFoot">潘佳丽 · 3D 个人小岛 · 拖拽可继续环视</div>
</aside>

<div id="ride"><span>🦆 正在骑大黄鸭环岛…</span><button id="rideStop">下岛 ESC</button></div>

<div id="loader">
  <div class="load-inner">
    <div class="big">数 智 启 航</div>
    <div class="sub">正在搭建潘佳丽的小岛…</div>
    <div class="load-bar"><i></i></div>
  </div>
</div>

const hotspots = [];
function register(id, root, label, y, ringR, view) {
  root.userData.pick = { module: id };
  if (!root.userData.ownPick) {
    root.traverse(o => {
      if (o.isMesh && !o.userData.pick) o.userData.pick = { module: id };

    new THREE.RingGeometry(ringR * 0.86, ringR, 40),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })
  );
  ring.rotation.x = -Math.PI / 2;
  const wp = new THREE.Vector3(); root.getWorldPosition(wp);
  ring.position.set(wp.x, 0.02, wp.z);
  world.add(ring);

  const el = document.createElement('div');
  el.className = 'tag'; el.textContent = label;
  document.getElementById('labels').appendChild(el);

  const h = { id, root, label, anchorY: y, ring, el, view, hover: 0, base: root.position.y };
  hotspots.push(h);
  return h;
}

const pointers = new Map();
let pinchDist = 0, dragTotal = 0, lastPointer = null;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { lastPointer = { x: e.clientX, y: e.clientY }; dragTotal = 0; canvas.classList.add('dragging'); }
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
  riding && endRide();
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) { updateHover(e); return; }
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1 && lastPointer) {
    const dx = e.clientX - lastPointer.x, dy = e.clientY - lastPointer.y;
    dragTotal += Math.abs(dx) + Math.abs(dy);
    want.theta -= dx * 0.0055;
    want.phi = Math.min(1.42, Math.max(0.42, want.phi - dy * 0.0045));
    lastPointer = { x: e.clientX, y: e.clientY };
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist) want.r = Math.min(R.max, Math.max(R.min, want.r - (d - pinchDist) * 0.03));
    pinchDist = d;
  }
  canvas.classList.remove('pointing');
  hideAllTagsFocus();
});
canvas.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) canvas.classList.remove('dragging');
  pinchDist = 0;
  if (dragTotal < 8) pick(e);
  lastPointer = null;
});
canvas.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); canvas.classList.remove('dragging'); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  want.r = Math.min(R.max, Math.max(R.min, want.r + e.deltaY * 0.016));
}, { passive: false });

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pickAt(e) {
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const roots = [];
  hotspots.forEach(h => { roots.push(h.root); if (h.extra) roots.push(...h.extra); });
  const hits = raycaster.intersectObjects(roots, true);
  for (const hit of hits) {
    let o = hit.object;
    while (o && !o.userData.pick) o = o.parent;
    if (o && o.userData.pick) return o.userData.pick;
  }
  return null;
}
let hoverId = null;
function updateHover(e) {
  const p = pickAt(e);
  const id = p ? p.module : null;
  canvas.classList.toggle('pointing', !!p);
  hoverId = id;
  hotspots.forEach(h => h.el.classList.toggle('on', h.id === id));
  if (id === 'duck') hoverId = 'duck';
}
function hideAllTagsFocus() { hotspots.forEach(h => h.el.classList.remove('on')); hoverId = null; }

function pick(e) {
  const p = pickAt(e);
  if (!p) return;
  if (p.isKey) { playNote(p.note); pressKeyMesh(p.key); return; }
  if (p.module === 'duck') { startRide(); return; }
  openPanel(p.module, true);
}

/* --- 音频 --- */
let actx = null;
function ac() {
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
  return actx;
}
function tone(freq, dur = 0.2, type = 'sine', vol = 0.1) {
  const ctx = ac(); if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, ctx.currentTime);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + dur + 0.02);
}
function playNote(f) { tone(f, 0.26, 'triangle', 0.11); }
function quack() {
  const ctx = ac(); if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(320, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.18);
  g.gain.setValueAtTime(0.08, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
  o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.3);
}

const FALLBACK = '这个问题我的知识库里还没有。<br>可以试试问她：<br>· 实习经历<br>· 项目作品<br>· 技能栈 / 能力对标<br>· 为什么想做数据产品经理<br>· 联系方式';
const SUGGEST = ['实习经历', '项目作品', '技能栈', '为什么想做数据产品', '联系方式'];

let chatStarted = false;
function bindChat() {
  const msgs = document.getElementById('msgs');
  const sug = document.getElementById('suggest');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('chatInput');
  sug.innerHTML = SUGGEST.map(s => `<button type="button">${s}</button>`).join('');
  sug.querySelectorAll('button').forEach(b => b.onclick = () => ask(b.textContent));
  form.onsubmit = e => { e.preventDefault(); ask(input.value.trim()); input.value = ''; };

  function addMe(t) {
    msgs.insertAdjacentHTML('beforeend', `<div class="msg me"><div class="bubble">${escapeHtml(t)}</div></div>`);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function addBot(html) {
    msgs.insertAdjacentHTML('beforeend', `<div class="msg"><div class="ava"></div><div class="bubble">${html}</div></div>`);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function ask(t) {
    if (!t) return;
    if (!chatStarted) { msgs.innerHTML = ''; chatStarted = true; }
    addMe(t);
    const typing = document.createElement('div');
    typing.className = 'msg';
    typing.innerHTML = `<div class="ava"></div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>`;
    msgs.appendChild(typing); msgs.scrollTop = msgs.scrollHeight;
    setTimeout(() => { typing.remove(); addBot(reply(t)); }, 700);
  }
  window.__ask = ask;

  if (!chatStarted) {
    chatStarted = true;
    addBot(`你好，我是潘佳丽的 AI 分身 👋<br>我脑子里装的是她的简历：4 段实习、2 项专利、一个国赛一等奖。<br>你可以直接问我，或者点下面的话题。`);
  }
}
function reply(q) {
  const s = q.toLowerCase();
  let best = null, score = 0;
  KB.forEach(item => {
    const hit = item.k.filter(k => s.includes(k.toLowerCase())).length;
    if (hit > score) { score = hit; best = item; }
  });
  if (best) return best.a;
  if (/[\u4e00-\u9fa5]/.test(q) && q.length < 4) return '多打几个字吧，比如「实习经历」或「技能栈」，我更好定位。';
  return FALLBACK;
}
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function resetChatState() { chatStarted = false; }

/* --- 骑鸭彩蛋 --- */
let riding = false, rideT = 0;
const rideEl = document.getElementById('ride');
function startRide() {
  riding = true; rideT = 0;
  quack();
  rideEl.classList.add('on'); document.body.classList.add('riding');
  hotspots.forEach(h => h.el.classList.remove('on'));
  closePanel();
}
function endRide() {
  if (!riding) return;
  riding = false;
  rideEl.classList.remove('on'); document.body.classList.remove('riding');
  want.theta = 0.55; want.phi = 0.96; want.r = 20.5;
  lookWant.set(0, 2.35, 0);
}
document.getElementById('rideStop').onclick = endRide;

/* ============================= 渲染循环 ============================= */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
const camPos = new THREE.Vector3();

function updateCamera(dt) {
  avatar.userData.bubble.visible = !riding;
  if (riding) {
    const da = rideT * 0.42;
    duck.position.x = pondC.x + Math.sin(da) * 0.6;
    duck.position.z = pondC.y + Math.cos(da) * 0.6;
    const camAng = -0.62 + Math.sin(rideT * 0.35) * 0.12;
    camPos.set(
      pondC.x + Math.sin(camAng) * 8.0,
      4.4 + Math.sin(rideT * 1.4) * 0.18,
      pondC.y + Math.cos(camAng) * 8.0
    );
    camera.position.lerp(camPos, 1 - Math.pow(0.002, dt));
    look.lerp(tmpV.set(duck.position.x, duck.position.y + 0.5, duck.position.z), 1 - Math.pow(0.002, dt));
    camera.lookAt(look);
    return;
  }
  const k = 1 - Math.pow(0.0009, dt);
  want.phi = Math.min(1.44, Math.max(0.4, want.phi));
  view.theta += (want.theta - view.theta) * k;
  view.phi += (want.phi - view.phi) * k;
  view.r += (want.r - view.r) * k;
  look.lerp(lookWant, k);
  const sp = Math.sin(view.phi), cp = Math.cos(view.phi);
  camera.position.set(
    look.x + view.r * sp * Math.sin(view.theta),
    look.y + view.r * cp + 0.9,
    look.z + view.r * sp * Math.cos(view.theta)
  );
  camera.lookAt(look);
}

function updateLabels() {
  const w = window.innerWidth, h = window.innerHeight;
  hotspots.forEach(hs => {
    const wp = hs.root.getWorldPosition(tmpV);
    wp.y += hs.anchorY;
    wp.project(camera);
    const vis = wp.z < 1 && wp.x > -1.2 && wp.x < 1.2 && wp.y > -1.2 && wp.y < 1.2;
    hs.el.style.display = vis ? 'block' : 'none';
    if (vis) {
      hs.el.style.left = ((wp.x + 1) / 2 * w) + 'px';
      hs.el.style.top = ((-wp.y + 1) / 2 * h) + 'px';
    }
  });
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  // 云飘
  clouds.forEach(c => {
    c.g.position.y = c.y0 + Math.sin(t * 0.4 + c.ph) * 0.35;
    c.g.position.x += Math.sin(t * 0.12 + c.ph) * 0.004;
  });
  // 数据方块
  cubes.forEach(c => {
    const u = c.userData;
    u.a += u.sp * dt;
    c.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(t * 0.8 + u.a) * 0.25, Math.sin(u.a) * u.r);
    c.rotation.x += 0.02; c.rotation.y += 0.03;
  });
  // 小人
  const walk = t * 0.55;
  avatar.position.x = Math.sin(walk) * 0.8 - 1.35;
  avatar.position.z = 1.5 + Math.cos(walk) * 0.35;
  avatar.rotation.y = Math.sin(walk) * 0.4 + 0.2;
  avatar.position.y = Math.abs(Math.sin(t * 2.4)) * 0.05;
  bubble.position.y = 2.5 + Math.sin(t * 1.6) * 0.05;
  bubble.material.opacity = 0.9 + Math.sin(t * 1.6) * 0.1;
  // 鸭子漂
  duck.position.y = duckPos.y + Math.sin(t * 1.4) * 0.06;
  duck.rotation.z = Math.sin(t * 1.1) * 0.05;
  duck.rotation.y = Math.sin(t * 0.3) * 0.4;
  // 水面
  pondWater.material.opacity = 1;
  // 琴键回弹
  for (let i = pressing.length - 1; i >= 0; i--) {
    const p = pressing[i]; p.t += dt;
    const kk = Math.min(p.t / 0.12, 1);
    p.m.position.y = p.m.userData.pick.oY - Math.sin(kk * Math.PI) * 0.035;
    if (p.t > 0.14) { p.m.position.y = p.m.userData.pick.oY; pressing.splice(i, 1); }
  }
  // hover
  let busy = openPanelLock();
  hotspots.forEach(hs => {
    const on = hoverId === hs.id && !busy;
    hs.hover += ((on ? 1 : 0) - hs.hover) * (1 - Math.pow(0.001, dt));
    hs.ring.material.opacity = hs.hover * 0.65;
    hs.root.position.y = hs.base + hs.hover * 0.07;
    if (hs.id !== 'duck' && on) hs.el.classList.add('on');
  });

  if (riding) rideT += dt;
  updateCamera(dt);
  updateLabels();
  renderer.render(scene, camera);
}
// 面板打开时不抬升物件（避免抖动）
function openPanelLock() { return !!opened && opened !== 'ai'; }

function applyViewport(reset) {
  const a = window.innerWidth / window.innerHeight;
  const portrait = a < 0.8;
  camera.aspect = a;
  camera.fov = portrait ? 58 : 38;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (reset) {
    const base = portrait ? 43 : 15.2;
    want.r = view.r = base;
    want.phi = view.phi = portrait ? 1.0 : 0.98;
    want.theta = view.theta = portrait ? 0.36 : 0.48;
    lookWant.set(portrait ? -0.35 : 0, portrait ? 1.5 : 2.35, 0);
    look.copy(lookWant);
  }
  return portrait;
}
window.addEventListener('resize', () => applyViewport(false));

const PORTRAIT = applyViewport(true);
/* 启动 */
camera.position.set(14, 11, 16);
animate();
setTimeout(() => document.getElementById('loader').classList.add('hide'), 500);
